# ============================================================================
# Mivara – build the Windows release installer in CI
# ============================================================================
# Why CI:
#   - reproducible release builds with the portable flag set
#     (OPT_FLAGS="-O3 -march=x86-64 -flto"; the default -march=native build
#     must never be redistributed);
#   - SignPath Foundation's free OSS code signing requires the signed
#     artifact to be produced by a trusted build system (GitHub Actions) —
#     locally built installers cannot be signed. See CODE_SIGNING_POLICY.md.
#
# What it does: MSYS2 (MinGW64) build → Inno Setup packaging →
#   dist/Mivara-Setup-<version>.exe, its fixed-name copy dist/Mivara-Setup.exe
#   and dist/SHA256SUMS.txt uploaded as one workflow artifact.
#   Publishing to a GitHub Release stays a manual step: download the artifact,
#   upload ALL THREE files to the release (the updater's in-app install is
#   fail-closed without SHA256SUMS.txt), then create the release.
#
# Enabling SignPath signing — only after the SignPath Foundation project is
# approved (the steps below the "SignPath" marker are inert until then):
#   1. In the SignPath dashboard note: organization id, project slug,
#      signing policy slug, artifact configuration slug (the artifact
#      configuration root element must be <zip-file> — actions/upload-artifact
#      zips by default).
#   2. Repo → Settings → Secrets and variables → Actions:
#        Secret   SIGNPATH_API_TOKEN
#        Variable SIGNPATH_ENABLED = true
#        Variable SIGNPATH_ORG_ID, SIGNPATH_PROJECT_SLUG,
#                 SIGNPATH_POLICY_SLUG, SIGNPATH_ARTIFACT_CONFIG_SLUG
#   3. Re-check action input names / version against the current docs:
#      https://docs.signpath.io/trusted-build-systems/github
# ============================================================================

name: Release installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSYS2 (MinGW64) and build dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-ffmpeg

      - name: Build (portable release flags)
        run: |
          export OS=Windows_NT   # the makefile's Windows branch is keyed on $(OS)
          make clean
          make OPT_FLAGS="-O3 -march=x86-64 -flto"
          make check

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" |
                  Select-Object -First 1 -ExpandProperty FullName
          & $iscc "installer\Mivara.iss"
          # The fixed-name copy is what the in-app updater downloads and what
          # the README "latest installer" badge points at; produce it here so a
          # maintainer never has to remember to make it by hand.
          $setup = Get-ChildItem dist -Filter "Mivara-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "no installer found in dist/" }
          Copy-Item $setup.FullName "dist/Mivara-Setup.exe" -Force
          Get-ChildItem dist -Filter *.exe | Format-Table Name, Length

      - name: Generate SHA256SUMS for the in-app updater
        shell: pwsh
        run: |
          # The GUI updater downloads Mivara-Setup.exe and refuses to run it
          # in-app unless SHA256SUMS.txt in the same release carries a matching
          # sha256sum-style line for that file name. ATTACH THIS FILE TO EVERY
          # RELEASE (see the release checklist in AGENTS.md).
          # If SignPath signing goes live the bytes change: the signed path
          # below regenerates this file from the SIGNED installer.
          $setup = Get-ChildItem dist -Filter "Mivara-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "no installer found in dist/" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $lines = @("$hash  $($setup.Name)", "$hash  Mivara-Setup.exe")
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      - name: Upload unsigned installer
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: |
            dist/Mivara-Setup-*.exe
            dist/Mivara-Setup.exe
            dist/SHA256SUMS.txt

      # ---------------------- SignPath (inert until enabled) ----------------
      - name: Submit signing request
        id: signpath
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Regenerate SHA256SUMS for the signed installer
        if: vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          # Signing changes the bytes, so the unsigned hashes would make the
          # in-app updater refuse the download (it is fail-closed on a mismatch).
          $setup = Get-ChildItem signed -Filter "Mivara-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "no signed installer found in signed/" }
          # Fail closed: never upload an "unsigned" artifact from the signed path.
          $sig = Get-AuthenticodeSignature $setup.FullName
          if ($sig.Status -ne 'Valid') { throw "installer signature is $($sig.Status), expected Valid" }
          Copy-Item $setup.FullName "signed/Mivara-Setup.exe" -Force
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $lines = @("$hash  $($setup.Name)", "$hash  Mivara-Setup.exe")
          [IO.File]::WriteAllText("$PWD/signed/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content signed/SHA256SUMS.txt

      - name: Upload signed installer
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: installer-signed
          path: |
            signed/*.exe
            signed/SHA256SUMS.txt
