# ============================================================================
# Mivara – build the Linux release packages in CI
# ============================================================================
# Why CI:
#   - the portable build flags (-O3 -march=x86-64 -flto) must never be
#     replaced by a host-specific -march=native build;
#   - a single, known glibc baseline: ubuntu-22.04 (glibc 2.35). The .deb
#     depends on that release's FFmpeg ABI; the tar.gz bundles the
#     FFmpeg/SDL/codec closure and only relies on the host for glibc, X11 and
#     the desktop stack.
#
# What it does: one 22.04 build per architecture (x86_64 on ubuntu-22.04,
#   aarch64 on ubuntu-22.04-arm) → dist/Mivara-linux-<arch>-<ver>.tar.gz, its
#   fixed-name copy, mivara_<ver>_<debarch>.deb, its fixed-name copy and a
#   per-arch SHA256SUMS-linux.txt. The merge job concatenates the checksum
#   files and uploads one `linux-packages` artifact with all nine files, which
#   is what scripts/release/linux.sh downloads.
#
# The -arm runner is GitHub's hosted arm64 runner, available to public repos.
# release.sh dispatches this workflow on the pushed release tag and uploads
# the artifact to the GitHub Release. Dispatch it by hand only to repair a
# release:
#   gh workflow run release-linux.yml --ref v0.13.0 -f version=0.13.0
#   bash scripts/release/linux.sh 0.13.0
# ============================================================================

name: Release Linux packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z (empty = src/version.h)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            linux_arch: x86_64
            deb_arch: amd64
          - runner: ubuntu-22.04-arm
            linux_arch: aarch64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      LINUX_ARCH: ${{ matrix.linux_arch }}
      DEB_ARCH: ${{ matrix.deb_arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libsdl2-dev libsdl2-ttf-dev \
            libavcodec-dev libavutil-dev libswscale-dev libxi-dev libxfixes-dev dpkg-dev patchelf

      - name: Build and package
        env:
          # Never interpolate a workflow input directly into the shell; the
          # script validates it, but the substitution happens before bash runs.
          MIVARA_VERSION: ${{ inputs.version }}
        run: |
          # Reproducible tar/deb timestamps. The checkout is exactly the tag
          # release.sh dispatched, so src/version.h already carries the
          # release version.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          bash scripts/release/package-linux.sh --ver "$MIVARA_VERSION"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ matrix.linux_arch }}
          path: |
            dist/Mivara-linux-*.tar.gz
            dist/mivara_*.deb
            dist/Mivara-linux-*.deb
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error

  merge-linux:
    needs: build-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download both architectures
        uses: actions/download-artifact@v7
        with:
          pattern: linux-packages-*
          path: artifacts

      - name: Merge packages and checksums
        run: |
          set -eu
          mkdir -p merged
          # upload-artifact flattens the common dist/ prefix today, but find
          # keeps this working if that changes.
          find artifacts -type f \( -name 'Mivara-linux-*' -o -name 'mivara_*.deb' \) \
            -exec cp -f {} merged/ \;
          x86sums="$(find artifacts/linux-packages-x86_64 -type f -name SHA256SUMS-linux.txt | head -n 1)"
          armsums="$(find artifacts/linux-packages-aarch64 -type f -name SHA256SUMS-linux.txt | head -n 1)"
          # Stable order: x86_64 first, then aarch64. scripts/release/linux.sh
          # validates every line and cmp's both fixed-name pairs.
          cat "$x86sums" "$armsums" > merged/SHA256SUMS-linux.txt
          ( cd merged && sha256sum -c SHA256SUMS-linux.txt )
          ls -l merged

      - name: Upload merged Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: merged/*
          if-no-files-found: error
